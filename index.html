<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Game Đoán Chữ</title>
    <style>
        body {
            background: #1e1e2f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: #2b2b40;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h1 { color: #00d2d3; font-size: 22px; margin-bottom: 10px; }
        .score-board { font-size: 14px; color: #a4b0be; margin-bottom: 20px; }
        .puzzle-card {
            background: #3a3a55;
            padding: 20px;
            border-radius: 12px;
            font-size: 26px;
            font-weight: bold;
            color: #ff9f43;
            letter-spacing: 3px;
            margin-bottom: 15px;
            border: 2px dashed #57577a;
        }
        .hint-text { font-style: italic; color: #ced6e0; margin-bottom: 20px; font-size: 14px; }
        .input-area { display: flex; gap: 8px; }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #57577a;
            background: #1e1e2f;
            color: white;
            font-size: 16px;
            outline: none;
            text-align: center;
        }
        input:focus { border-color: #00d2d3; }
        button {
            background: #00d2d3;
            color: #1e1e2f;
            border: none;
            padding: 12px 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #01a3a4; }
        .notification { margin-top: 15px; font-weight: bold; min-height: 24px; font-size: 15px; }
    </style>
</head>
<body>

    <div class="box">
        <h1>🎯 Đuổi Hình Bắt Chữ</h1>
        <div class="score-board">Điểm số: <span id="sc">0</span> | Câu hỏi: <span id="lvl">1</span>/3</div>
        
        <div class="puzzle-card" id="pz">Đang tải...</div>
        <div class="hint-text" id="ht">Gợi ý: ...</div>

        <div class="input-area">
            <input type="text" id="ans" placeholder="Nhập đáp án..." onkeypress="onEnter(event)">
            <button onclick="submitAnswer()">Gửi</button>
        </div>

        <div class="notification" id="notif"></div>
    </div>

    <script>
        const gameData = [
            { question: "CÁ + KHO", answer: "cá kho", hint: "Món ăn mặn ăn cùng cơm hằng ngày." },
            { question: "XE + ÔM", answer: "xe ôm", hint: "Phương tiện di chuyển phổ biến trên phố." },
            { question: "MẬT + ONG", answer: "mật ong", hint: "Chất ngọt do loài côn trùng có cánh tạo ra." }
        ];

        let index = 0;
        let score = 0;

        const pzEl = document.getElementById("pz");
        const htEl = document.getElementById("ht");
        const ansEl = document.getElementById("ans");
        const notifEl = document.getElementById("notif");
        const scEl = document.getElementById("sc");
        const lvlEl = document.getElementById("lvl");

        function renderGame() {
            if (index >= gameData.length) {
                document.querySelector(".box").innerHTML = `
                    <h1>🏆 HOÀN THÀNH XUẤT SẮC!</h1>
                    <p style="margin: 20px 0; font-size: 16px;">Tổng điểm của bạn: <b>${score}</b> điểm</p>
                    <button onclick="location.reload()" style="width: 100%;">Chơi Lại Từ Đầu</button>
                `;
                return;
            }
            pzEl.innerText = gameData[index].question;
            htEl.innerText = "Gợi ý: " + gameData[index].hint;
            ansEl.value = "";
            notifEl.innerText = "";
            scEl.innerText = score;
            lvlEl.innerText = index + 1;
        }

        function submitAnswer() {
            let userVal = ansEl.value.trim().toLowerCase();
            let correctVal = gameData[index].answer.toLowerCase();

            if (!userVal) {
                notifEl.style.color = "#ff6b81";
                notifEl.innerText = "⚠️ Vui lòng nhập từ khóa trả lời!";
                return;
            }

            if (userVal === correctVal) {
                score += 10;
                notifEl.style.color = "#2ed573";
                notifEl.innerText = "🎉 Chính xác! Tuyệt vời!";
                index++;
                setTimeout(renderGame, 1500);
            } else {
                notifEl.style.color = "#ff4757";
                notifEl.innerText = "❌ Sai rồi, hãy thử suy nghĩ lại nhé!";
            }
        }

        function onEnter(e) {
            if (e.key === "Enter") {
                submitAnswer();
            }
        }

        renderGame();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game đố vui - Joke of the day</title>
    <!-- Thư viện pháo hoa giấy (Canvas Confetti) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2d2342, #3b2e59, #4f3a65);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e2e8f0;
            padding: 20px;
        }

        .menu-container {
            text-align: center;
            background: rgba(45, 35, 66, 0.75);
            padding: 30px 40px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px 0 rgba(15, 10, 25, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.12);
            width: 450px;
            position: relative;
            overflow: hidden;
        }

        .music-toggle {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #cbd5e1;
            padding: 5px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .music-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
            color: #f1f5f9;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.1rem;
            font-style: italic;
            margin-bottom: 20px;
            color: #fbbf24;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background-color: #8b5cf6;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25);
            width: 100%;
        }

        .btn:hover {
            background-color: #7c3aed;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(139, 92, 246, 0.4);
        }

        .btn-hint {
            background-color: #f59e0b;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
        }
        .btn-hint:hover {
            background-color: #d97706;
        }

        .btn-skip {
            background-color: #f43f5e;
            color: white;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.25);
        }
        .btn-skip:hover {
            background-color: #e11d48;
        }

        .btn-back {
            background-color: #38bdf8;
            color: #0f172a;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
        }
        .btn-back:hover {
            background-color: #0ea5e9;
            color: white;
        }

        .question-box {
            font-size: 1.1rem;
            margin-bottom: 15px;
            line-height: 1.5;
            text-align: left;
            background: rgba(255, 255, 255, 0.08);
            color: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hint-box {
            font-size: 0.95rem;
            color: #fef08a;
            margin-bottom: 15px;
            font-style: italic;
            display: none;
            text-align: left;
            background: rgba(245, 158, 11, 0.15);
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
            100% { transform: translateX(0); }
        }

        .shake-warning {
            animation: shake 0.4s ease;
            background-color: rgba(239, 68, 68, 0.25) !important;
            color: #fca5a5 !important;
            border-color: #ef4444 !important;
        }

        .answer-input {
            width: 100%;
            padding: 11px 15px;
            font-size: 1rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(15, 10, 25, 0.5);
            color: #ffffff;
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .answer-input::placeholder {
            color: #94a3b8;
        }

        .answer-input:focus {
            border-color: #8b5cf6;
        }

        .score-board {
            font-size: 0.95rem;
            margin-bottom: 15px;
            color: #cbd5e1;
            font-weight: 500;
        }

        /* Hiệu ứng pop-up biểu tượng phản hồi (mặt buồn hoặc pháo hoa) */
        #feedback-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 5rem;
            z-index: 10;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        #feedback-popup.show {
            transform: translate(-50%, -50%) scale(1);
        }

        .result-summary {
            text-align: left;
            max-height: 230px;
            overflow-y: auto;
            background: rgba(15, 10, 25, 0.4);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .result-item {
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
        }

        .correct-text { color: #34d399; font-weight: bold; }
        .wrong-text { color: #f87171; font-weight: bold; }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Thẻ âm thanh nhạc nền -->
    <audio id="bg-music" loop>
        <source src="Themesound.mp4" type="audio/mp4">
        Trình duyệt của bạn không hỗ trợ thẻ audio.
    </audio>

    <div class="menu-container">
        <!-- Nơi hiển thị icon phản hồi (Mặt buồn / Pháo hoa) -->
        <div id="feedback-popup">😢</div>

        <!-- Nút bật/tắt nhạc -->
        <button class="music-toggle" id="music-btn" onclick="toggleMusic()">🔊 Nhạc: Bật</button>

        <!-- MÀN HÌNH MENU CHÍNH -->
        <div id="main-menu">
            <h1>Game đố vui</h1>
            <div class="subtitle">Joke of the day</div>
            
            <div class="menu-buttons">
                <button class="btn" onclick="showModes()">Bắt đầu chơi</button>
                <button class="btn btn-hint" onclick="alert('Trả lời đúng có chuông & pháo hoa, trả lời sai có tiếng tẹt tẹt & mặt buồn!')">Hướng dẫn</button>
                <button class="btn btn-back" onclick="alert('Phiên bản v2.0 - Tích hợp âm thanh chuông, pháo hoa và icon trực quan!')">Cài đặt</button>
            </div>
        </div>

        <!-- MÀN HÌNH CHỌN CHẾ ĐỘ -->
        <div id="mode-menu" class="hidden">
            <h1>Chọn chế độ</h1>
            <div class="subtitle">Joke of the day</div>
            
            <div class="menu-buttons">
                <button class="btn" onclick="startGame('EASY')">EASY (Dễ)</button>
                <button class="btn btn-hint" onclick="startGame('MID')">MID (Trung bình)</button>
                <button class="btn btn-skip" onclick="startGame('HARD')">HARD (Khó)</button>
                <button class="btn btn-back" onclick="showMain()">Quay lại</button>
            </div>
        </div>

        <!-- MÀN HÌNH CHƠI GAME -->
        <div id="game-screen" class="hidden">
            <h1 id="mode-title" style="font-size: 1.5rem;">Chế độ</h1>
            <div class="score-board" id="score-text">Câu: 1/4 | Điểm: 0 | ⏱️ 30s</div>
            
            <div class="question-box" id="question-text">Nội dung câu hỏi ở đây...</div>
            
            <div class="hint-box" id="hint-text">💡 Gợi ý: ...</div>
            
            <input type="text" id="user-answer" class="answer-input" placeholder="Nhập câu trả lời...">
            
            <div class="menu-buttons">
                <button class="btn" onclick="checkAnswer()">Trả lời</button>
                <button class="btn btn-hint" id="hint-btn" onclick="useHint()">Xem gợi ý</button>
                <button class="btn btn-skip" onclick="skipQuestion()">Skip (Bỏ qua)</button>
                <button class="btn btn-back" onclick="showModes()">Chọn chế độ khác</button>
            </div>
        </div>

        <!-- MÀN HÌNH TỔNG KẾT KẾT QUẢ -->
        <div id="summary-screen" class="hidden">
            <h1 style="font-size: 1.8rem;">Kết quả tổng kết</h1>
            <div class="subtitle" id="final-score-title">Đạt điểm: 0/0</div>
            
            <div class="result-summary" id="result-list"></div>
            
            <div class="menu-buttons">
                <button class="btn" onclick="showModes()">Chơi lại màn khác</button>
                <button class="btn btn-back" onclick="showMain()">Về menu chính</button>
            </div>
        </div>
    </div>

    <script>
        const questionsData = {
            'EASY': [
                { q: "Cái gì có cổ nhưng không có đầu?", a: ["cái áo", "ao"], hints: ["Manh mối 1: Thường mặc vào người khi trời lạnh.", "Manh mối 2: Có tay áo và thân áo."] },
                { q: "Cái gì đi mà không bao giờ mỏi chân?", a: ["đồng hồ", "dong ho"], hints: ["Manh mối 1: Nó phát ra tiếng tích tắc.", "Manh mối 2: Dùng để xem giờ giấc."] },
                { q: "Cái gì càng giặt càng bẩn?", a: ["nước", "nuoc"], hints: ["Manh mối 1: Là chất lỏng.", "Manh mối 2: Dùng để rửa trôi vết bẩn nhưng chính nó lại chứa vết bẩn đó."] },
                { q: "Cái gì có răng nhưng không cắn được?", a: ["cái lược", "cai luoc", "luoc"], hints: ["Manh mối 1: Dùng cho tóc.", "Manh mối 2: Thường dùng sau khi gội đầu xong."] }
            ],
            'MID': [
                { q: "Con gì có cánh có đuôi không có lông mà lại bay rất cao?", a: ["con diều", "diều", "con dieu", "dieu"], hints: ["Manh mối 1: Không phải động vật sống.", "Manh mối 2: Trẻ em thích thả trên cánh đồng."] },
                { q: "Con gì càng lớn càng bé?", a: ["con cua", "cua"], hints: ["Manh mối 1: Sống dưới nước hoặc bờ sông/biển.", "Manh mối 2: Tên của nó có chữ C và khi luộc chuyển màu đỏ."] },
                { q: "Cá biết nấu ăn gọi là gì?", a: ["cá chef", "ca chef", "chef"], hints: ["Manh mối 1: Là từ ghép tiếng Việt và tiếng Anh.", "Manh mối 2: Từ tiếng Anh chỉ đầu bếp là chef."] },
                { q: "Con gì đập thì sống, không đập thì chết?", a: ["con tim", "tim", "trái tim", "trai tim"], hints: ["Manh mối 1: Nằm trong lồng ngực.", "Manh mối 2: Nó co bóp liên tục để bơm máu."] }
            ],
            'HARD': [
                { q: "Một tàu điện chạy về hướng Nam, gió thổi từ Đông sang Tây. Vậy khói của tàu chạy hướng nào?", a: ["không có khói", "khong co khoi", "tau khong co khoi", "tàu không có khói"], hints: ["Manh mối 1: Hãy chú ý kỹ tên phương tiện.", "Manh mối 2: Tàu điện chạy bằng điện chứ không đốt than/dầu."] },
                { q: "Hướng nào có nhiều đàn ông?", a: ["đông nam", "dong nam"], hints: ["Manh mối 1: Liên quan đến các hướng la bàn.", "Manh mối 2: Gộp từ 'Đông' và 'Nam'."] },
                { q: "Lịch nào dài nhất?", a: ["lịch sử", "lich su"], hints: ["Manh mối 1: Không treo tường bằng giấy.", "Manh mối 2: Ghi chép quá khứ loài người."] }
            ]
        };

        let currentMode = '';
        let currentIndex = 0;
        let score = 0;
        let currentQuestions = [];
        let historyLog = [];
        let hintsLeft = 0;
        let isMusicPlaying = false;
        let timer = null;
        let timeLeft = 30;

        // Trình tạo âm thanh hiệu ứng bằng code (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playCorrectSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let now = audioCtx.currentTime;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now); // Nốt C5
            osc.frequency.setValueAtTime(659.25, now + 0.1); // Nốt E5
            osc.frequency.setValueAtTime(783.99, now + 0.2); // Nốt G5
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.6);
        }

        function playWrongSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let now = audioCtx.currentTime;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.setValueAtTime(110, now + 0.15);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        }

        // Hiệu ứng pháo hoa giấy chúc mừng
        function triggerConfetti() {
            confetti({
                particleCount: 80,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        // Hiển thị icon phản hồi (Mặt buồn / Pháo hoa)
        function showFeedback(type) {
            let popup = document.getElementById('feedback-popup');
            if (type === 'sad') {
                popup.innerText = "😢";
                playWrongSound();
            } else if (type === 'happy') {
                popup.innerText = "🎉";
                playCorrectSound();
                triggerConfetti();
            }
            popup.classList.add('show');
            setTimeout(() => {
                popup.classList.remove('show');
            }, 800);
        }

        document.addEventListener('click', function() {
            let music = document.getElementById('bg-music');
            if (!isMusicPlaying && music.paused) {
                music.play().then(() => {
                    isMusicPlaying = true;
                    document.getElementById('music-btn').innerText = "🔊 Nhạc: Bật";
                }).catch(e => console.log("Autoplay blocked"));
            }
        }, { once: true });

        function toggleMusic() {
            let music = document.getElementById('bg-music');
            let btn = document.getElementById('music-btn');
            if (music.paused) {
                music.play();
                btn.innerText = "🔊 Nhạc: Bật";
                isMusicPlaying = true;
            } else {
                music.pause();
                btn.innerText = "🔇 Nhạc: Tắt";
                isMusicPlaying = false;
            }
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function showModes() {
            clearInterval(timer);
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('summary-screen').classList.add('hidden');
            document.getElementById('mode-menu').classList.remove('hidden');
        }

        function showMain() {
            clearInterval(timer);
            document.getElementById('mode-menu').classList.add('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('summary-screen').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }

        function startGame(mode) {
            currentMode = mode;
            currentIndex = 0;
            score = 0;
            historyLog = [];
            currentQuestions = shuffleArray(questionsData[mode]);
            hintsLeft = Math.floor(currentQuestions.length / 2);

            document.getElementById('mode-menu').classList.add('hidden');
            document.getElementById('summary-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('mode-title').innerText = 'Chế độ: ' + mode;

            loadQuestion();
        }

        function loadQuestion() {
            clearInterval(timer);
            if (currentIndex < currentQuestions.length) {
                let qObj = currentQuestions[currentIndex];
                document.getElementById('question-text').innerText = (currentIndex + 1) + ". " + qObj.q;
                document.getElementById('user-answer').value = '';
                
                let hintBox = document.getElementById('hint-text');
                hintBox.style.display = 'none';
                hintBox.innerText = "";

                timeLeft = 30;
                updateTimerDisplay();
                timer = setInterval(() => {
                    timeLeft--;
                    updateTimerDisplay();
                    if (timeLeft <= 0) {
                        clearInterval(timer);
                        showFeedback('sad');
                        historyLog.push({
                            question: qObj.q,
                            userAns: "(Hết giờ)",
                            correct: false,
                            standardAns: qObj.a[0]
                        });
                        currentIndex++;
                        setTimeout(loadQuestion, 900);
                    }
                }, 1000);
            } else {
                showSummary();
            }
        }

        function updateTimerDisplay() {
            document.getElementById('score-text').innerText = `Câu: ${currentIndex + 1}/${currentQuestions.length} | Điểm: ${score} | ⏱️ ${timeLeft}s`;
        }

        function useHint() {
            let qObj = currentQuestions[currentIndex];
            let hintBox = document.getElementById('hint-text');

            if (hintsLeft > 0) {
                hintsLeft--;
                let hintContent = qObj.hints.join("<br>💡 ");
                hintBox.style.display = 'block';
                hintBox.innerHTML = "💡 " + hintContent;
            } else {
                hintBox.style.display = 'block';
                hintBox.innerHTML = "⚠️ Bạn đã dùng hết lượt gợi ý trong màn này rồi!";
                hintBox.classList.add('shake-warning');

                setTimeout(() => {
                    hintBox.classList.remove('shake-warning');
                    hintBox.style.display = 'none';
                    hintBox.innerHTML = "";
                }, 3000);
            }
        }

        function skipQuestion() {
            let qObj = currentQuestions[currentIndex];
            showFeedback('sad');
            historyLog.push({
                question: qObj.q,
                userAns: "(Đã bỏ qua)",
                correct: false,
                standardAns: qObj.a[0]
            });
            currentIndex++;
            setTimeout(loadQuestion, 900);
        }

        function checkAnswer() {
            let userAns = document.getElementById('user-answer').value.trim();
            let qObj = currentQuestions[currentIndex];
            let correctList = qObj.a;

            if (userAns === "") {
                alert("Vui lòng nhập đáp án trước khi trả lời nhé!");
                return;
            }

            let lowerUserAns = userAns.toLowerCase();
            let isCorrect = correctList.some(ans => lowerUserAns.includes(ans));

            if (isCorrect) {
                score++;
                showFeedback('happy');
                historyLog.push({
                    question: qObj.q,
                    userAns: userAns,
                    correct: true,
                    standardAns: correctList[0]
                });
            } else {
                showFeedback('sad');
                historyLog.push({
                    question: qObj.q,
                    userAns: userAns,
                    correct: false,
                    standardAns: correctList[0]
                });
            }

            currentIndex++;
            // Đợi hiệu ứng âm thanh/icon chạy xong 0.9 giây rồi chuyển câu
            setTimeout(loadQuestion, 900);
        }

        function showSummary() {
            clearInterval(timer);
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('summary-screen').classList.remove('hidden');
            document.getElementById('final-score-title').innerText = `Tổng điểm: ${score} / ${currentQuestions.length}`;

            let listHTML = '';
            historyLog.forEach((item, index) => {
                if (item.correct) {
                    listHTML += `<div class="result-item">
                        <strong>C. ${index + 1}:</strong> ${item.question}<br>
                        - Đáp án của bạn: <span class="correct-text">${item.userAns} (Đúng)</span>
                    </div>`;
                } else {
                    listHTML += `<div class="result-item">
                        <strong>C. ${index + 1}:</strong> ${item.question}<br>
                        - Đáp án của bạn: <span class="wrong-text">${item.userAns} (Sai)</span><br>
                        - Đáp án chuẩn: <span style="color: #fbbf24;">${item.standardAns}</span>
                    </div>`;
                }
            });

            document.getElementById('result-list').innerHTML = listHTML;
        }

        document.getElementById('user-answer').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });
    </script>

</body>
</html>

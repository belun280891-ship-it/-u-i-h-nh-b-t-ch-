<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Đua Vịt Vui Nhộn</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e0f7fa;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #00796b;
        }
        #game-container {
            width: 800px;
            margin: 20px auto;
            background: #81d4fa;
            border: 4px solid #0288d1;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .lane {
            height: 80px;
            border-bottom: 2px dashed #b3e5fc;
            position: relative;
            display: flex;
            align-items: center;
        }
        .lane:last-child {
            border-bottom: none;
        }
        .lane-label {
            position: absolute;
            left: 10px;
            font-weight: bold;
            color: #01579b;
        }
        .duck {
            font-size: 40px;
            position: absolute;
            left: 80px;
            transition: transform 0.1s;
        }
        #finish-line {
            position: absolute;
            right: 50px;
            top: 0;
            width: 4px;
            height: 100%;
            background-color: #d32f2f;
        }
        #controls {
            margin-top: 20px;
        }
        button {
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:hover {
            background-color: #f57c00;
        }
        button:disabled {
            background-color: #b0bec5;
            cursor: not-allowed;
        }
        #result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            color: #d32f2f;
        }
    </style>
</head>
<body>

    <h1>🦆 Game Đua Vịt Vui Nhộn 🦆</h1>
    
    <div id="game-container">
        <div id="finish-line"></div>
        
        <div class="lane">
            <span class="lane-label">Vịt 1</span>
            <div class="duck" id="duck0">🐥</div>
        </div>
        <div class="lane">
            <span class="lane-label">Vịt 2</span>
            <div class="duck" id="duck1">🦆</div>
        </div>
        <div class="lane">
            <span class="lane-label">Vịt 3</span>
            <div class="duck" id="duck2">🐤</div>
        </div>
        <div class="lane">
            <span class="lane-label">Vịt 4</span>
            <div class="duck" id="duck3">🐥</div>
        </div>
    </div>

    <div id="controls">
        <button id="start-btn" onclick="startRace()">Bắt Đầu Đua!</button>
    </div>

    <div id="result"></div>

    <script>
        const finishLineX = 700; // Vị trí vạch đích tính bằng pixel
        let isRacing = false;

        function startRace() {
            if (isRacing) return;
            isRacing = true;
            
            document.getElementById('start-btn').disabled = true;
            document.getElementById('result').innerText = '';

            // Đặt lại vị trí ban đầu cho các chú vịt
            const ducks = [
                { element: document.getElementById('duck0'), pos: 80 },
                { element: document.getElementById('duck1'), pos: 80 },
                { element: document.getElementById('duck2'), pos: 80 },
                { element: document.getElementById('duck3'), pos: 80 }
            ];

            ducks.forEach(duck => {
                duck.element.style.left = duck.pos + 'px';
            });

            // Vòng lặp cập nhật chuyển động của vịt
            const raceInterval = setInterval(() => {
                let winner = null;

                ducks.forEach((duck, index) => {
                    // Tạo tốc độ ngẫu nhiên cho mỗi bước chạy
                    const speed = Math.random() * 6 + 2; 
                    duck.pos += speed;
                    duck.element.style.left = duck.pos + 'px';

                    // Kiểm tra xem vịt nào chạm vạch đích trước
                    if (duck.pos >= finishLineX && !winner) {
                        winner = index + 1;
                    }
                });

                // Nếu có chú vịt về đích
                if (winner) {
                    clearInterval(raceInterval);
                    isRacing = false;
                    document.getElementById('result').innerText = `🎉 Chúc mừng! Vịt số ${winner} đã giành chiến thắng! 🏆`;
                    document.getElementById('start-btn').disabled = false;
                }
            }, 30);
        }
    </script>

</body>
</html>

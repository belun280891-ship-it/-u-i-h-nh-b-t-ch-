<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game đố vui - Joke of the day</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .menu-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px 60px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            width: 380px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.1rem;
            font-style: italic;
            margin-bottom: 25px;
            color: #ffd700;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 100%;
        }

        .btn:hover {
            background-color: #ff5252;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-back {
            background-color: #6c757d;
        }
        .btn-back:hover {
            background-color: #5a6268;
        }

        /* Ẩn các màn hình phụ bằng CSS */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <!-- MÀN HÌNH MENU CHÍNH -->
        <div id="main-menu">
            <h1>Game đố vui</h1>
            <div class="subtitle">Joke of the day</div>
            
            <div class="menu-buttons">
                <button class="btn" onclick="showModes()">Bắt đầu chơi</button>
                <button class="btn" onclick="alert('Xem hướng dẫn!')">Hướng dẫn</button>
                <button class="btn" onclick="alert('Cài đặt game!')">Cài đặt</button>
            </div>
        </div>

        <!-- MÀN HÌNH CHỌN 3 CHẾ ĐỘ CHƠI -->
        <div id="mode-menu" class="hidden">
            <h1>Chọn chế độ</h1>
            <div class="subtitle">Joke of the day</div>
            
            <div class="menu-buttons">
                <button class="btn" onclick="startGame('EASY')">EASY (Dễ)</button>
                <button class="btn" onclick="startGame('MID')">MID (Trung bình)</button>
                <button class="btn" onclick="startGame('HARD')">HARD (Khó)</button>
                <button class="btn btn-back" onclick="showMain()">Quay lại</button>
            </div>
        </div>
    </div>

    <script>
        function showModes() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('mode-menu').classList.remove('hidden');
        }

        function showMain() {
            document.getElementById('mode-menu').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }

        function startGame(mode) {
            alert('Bạn đã chọn chế độ: ' + mode + '. Sẵn sàng bước vào câu hỏi nhé!');
            // Sau này chúng ta sẽ viết tiếp code hiển thị câu hỏi tương ứng ở đây
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game đố vui - Joke of the day</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Tone nền chuyển sắc pastel dịu nhẹ (Xanh dương - Tím nhạt - Hồng phấn) */
            background: linear-gradient(135deg, #a1c4fd, #c2e9fb, #fbc8d4);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #4a4a4a;
            padding: 20px;
        }

        .menu-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.65);
            padding: 30px 40px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px 0 rgba(100, 116, 139, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.8);
            width: 450px;
            position: relative;
        }

        .music-toggle {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #e2e8f0;
            color: #64748b;
            padding: 5px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .music-toggle:hover {
            background: rgba(255, 255, 255, 1);
            color: #334155;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
            color: #475569;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
        }

        .subtitle {
            font-size: 1.1rem;
            font-style: italic;
            margin-bottom: 20px;
            color: #94a3b8;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background-color: #b48efa; /* Tím pastel dịu */
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(180, 142, 250, 0.3);
            width: 100%;
        }

        .btn:hover {
            background-color: #a275f4;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(180, 142, 250, 0.4);
        }

        .btn-hint {
            background-color: #fef08a; /* Vàng kem pastel */
            color: #713f12;
            box-shadow: 0 4px 12px rgba(254, 240, 138, 0.4);
        }
        .btn-hint:hover {
            background-color: #fde047;
        }

        .btn-skip {
            background-color: #fdbca7; /* Hồng cam pastel */
            color: #7c2d12;
            box-shadow: 0 4px 12px rgba(253, 188, 167, 0.4);
        }
        .btn-skip:hover {
            background-color: #fb923c;
            color: white;
        }

        .btn-back {
            background-color: #cbd5e1; /* Xám trắng pastel */
            color: #475569;
            box-shadow: 0 4px 12px rgba(203, 213, 225, 0.3);
        }
        .btn-back:hover {
            background-color: #94a3b8;
            color: white;
        }

        .question-box {
            font-size: 1.1rem;
            margin-bottom: 15px;
            line-height: 1.5;
            text-align: left;
            background: rgba(255, 255, 255, 0.7);
            color: #334155;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .hint-box {
            font-size: 0.95rem;
            color: #854d0e;
            margin-bottom: 15px;
            font-style: italic;
            display: none;
            text-align: left;
            background: rgba(254, 240, 138, 0.4);
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #fef08a;
            transition: background-color 0.3s ease;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
            100% { transform: translateX(0); }
        }

        .shake-warning {
            animation: shake 0.4s ease;
            background-color: rgba(248, 113, 113, 0.3) !important;
            color: #991b1b !important;
            border-color: #fca5a5 !important;
        }

        .answer-input {
            width: 100%;
            padding: 11px 15px;
            font-size: 1rem;
            border-radius: 20px;
            border: 1px solid #cbd5e1;
            background: rgba(255, 255, 255, 0.9);
            color: #334155;
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .answer-input:focus {
            border-color: #b48efa;
        }

        .score-board {
            font-size: 0.95rem;
            margin-bottom: 15px;
            color: #64748b;
            font-weight: 500;
        }

        .result-summary {
            text-align: left;
            max-height: 230px;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.6);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 0.95rem;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .result-item {
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(226, 232, 240, 0.6);
            color: #334155;
        }

        .correct-text { color: #10b981; font-weight: bold; } /* Xanh lá pastel đậm vừa */
        .wrong-text { color: #ef4444; font-weight: bold; }   /* Đỏ pastel dịu */

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Thẻ âm thanh nhạc nền -->
    <audio id="bg-music" loop>
        <source src="Themesound.mp4" type="audio/mp4">
        Trình duyệt của bạn không hỗ trợ thẻ audio.
    </audio>

    <div class="menu-container">
        <!-- Nút bật/tắt nhạc -->
        <button class="music-toggle" id="music-btn" onclick="toggleMusic()">🔊 Nhạc: Bật</button>

        <!-- MÀN HÌNH MENU CHÍNH -->
        <div id="main-menu">
            <h1>Game đố vui</h1>
            <div class="subtitle">Joke of the day</div>
            
            <div class="menu-buttons">
                <button class="btn" onclick="showModes()">Bắt đầu chơi</button>
                <button class="btn" onclick="alert('Trò chơi đố vui hack não với giao diện Pastel dịu mắt!')">Hướng dẫn</button>
                <button class="btn" onclick="alert('Phiên bản v1.8 - Giao diện Tone Pastel Xanh, Tím, Hồng, Trắng, Vàng nhẹ nhàng!')">Cài đặt</button>
            </div>
        </div>

        <!-- MÀN HÌNH CHỌN CHẾ ĐỘ -->
        <div id="mode-menu" class="hidden">
            <h1>Chọn chế độ</h1>
            <div class="subtitle">Joke of the day</div>
            
            <div class="menu-buttons">
                <button class="btn" onclick="startGame('EASY')">EASY (Dễ)</button>
                <button class="btn" onclick="startGame('MID')">MID (Trung bình)</button>
                <button class="btn" onclick="startGame('HARD')">HARD (Khó)</button>
                <button class="btn btn-back" onclick="showModes()">Quay lại</button>
            </div>
        </div>

        <!-- MÀN HÌNH CHƠI GAME -->
        <div id="game-screen" class="hidden">
            <h1 id="mode-title" style="font-size: 1.5rem;">Chế độ</h1>
            <div class="score-board" id="score-text">Câu: 1/4 | Điểm: 0 | ⏱️ 30s</div>
            
            <div class="question-box" id="question-text">Nội dung câu hỏi ở đây...</div>
            
            <div class="hint-box" id="hint-text">💡 Gợi ý: ...</div>
            
            <input type="text" id="user-answer" class="answer-input" placeholder="Nhập câu trả lời...">
            
            <div class="menu-buttons">
                <button class="btn" onclick="checkAnswer()">Trả lời</button>
                <button class="btn btn-hint" id="hint-btn" onclick="useHint()">Xem gợi ý</button>
                <button class="btn btn-skip" onclick="skipQuestion()">Skip (Bỏ qua)</button>
                <button class="btn btn-back" onclick="showModes()">Chọn chế độ khác</button>
            </div>
        </div>

        <!-- MÀN HÌNH TỔNG KẾT KẾT QUẢ -->
        <div id="summary-screen" class="hidden">
            <h1 style="font-size: 1.8rem;">Kết quả tổng kết</h1>
            <div class="subtitle" id="final-score-title">Đạt điểm: 0/0</div>
            
            <div class="result-summary" id="result-list"></div>
            
            <div class="menu-buttons">
                <button class="btn" onclick="showModes()">Chơi lại màn khác</button>
                <button class="btn btn-back" onclick="showMain()">Về menu chính</button>
            </div>
        </div>
    </div>

    <script>
        const questionsData = {
            'EASY': [
                { q: "Cái gì có cổ nhưng không có đầu?", a: ["cái áo", "ao"], hints: ["Manh mối 1: Thường mặc vào người khi trời lạnh.", "Manh mối 2: Có tay áo và thân áo."] },
                { q: "Cái gì đi mà không bao giờ mỏi chân?", a: ["đồng hồ", "dong ho"], hints: ["Manh mối 1: Nó phát ra tiếng tích tắc.", "Manh mối 2: Dùng để xem giờ giấc."] },
                { q: "Cái gì càng giặt càng bẩn?", a: ["nước", "nuoc"], hints: ["Manh mối 1: Là chất lỏng.", "Manh mối 2: Dùng để rửa trôi vết bẩn nhưng chính nó lại chứa vết bẩn đó."] },
                { q: "Cái gì có răng nhưng không cắn được?", a: ["cái lược", "cai luoc", "luoc"], hints: ["Manh mối 1: Dùng cho tóc.", "Manh mối 2: Thường dùng sau khi gội đầu xong."] }
            ],
            'MID': [
                { q: "Con gì có cánh có đuôi không có lông mà lại bay rất cao?", a: ["con diều", "diều", "con dieu", "dieu"], hints: ["Manh mối 1: Không phải động vật sống.", "Manh mối 2: Trẻ em thích thả trên cánh đồng."] },
                { q: "Con gì càng lớn càng bé?", a: ["con cua", "cua"], hints: ["Manh mối 1: Sống dưới nước hoặc bờ sông/biển.", "Manh mối 2: Tên của nó có chữ C và khi luộc chuyển màu đỏ."] },
                { q: "Cá biết nấu ăn gọi là gì?", a: ["cá chef", "ca chef", "chef"], hints: ["Manh mối 1: Là từ ghép tiếng Việt và tiếng Anh.", "Manh mối 2: Từ tiếng Anh chỉ đầu bếp là chef."] },
                { q: "Con gì đập thì sống, không đập thì chết?", a: ["con tim", "tim", "trái tim", "trai tim"], hints: ["Manh mối 1: Nằm trong lồng ngực.", "Manh mối 2: Nó co bóp liên tục để bơm máu."] }
            ],
            'HARD': [
                { q: "Một tàu điện chạy về hướng Nam, gió thổi từ Đông sang Tây. Vậy khói của tàu chạy hướng nào?", a: ["không có khói", "khong co khoi", "tau khong co khoi", "tàu không có khói"], hints: ["Manh mối 1: Hãy chú ý kỹ tên phương tiện.", "Manh mối 2: Tàu điện chạy bằng điện chứ không đốt than/dầu."] },
                { q: "Hướng nào có nhiều đàn ông?", a: ["đông nam", "dong nam"], hints: ["Manh mối 1: Liên quan đến các hướng la bàn.", "Manh mối 2: Gộp từ 'Đông' và 'Nam'."] },
                { q: "Lịch nào dài nhất?", a: ["lịch sử", "lich su"], hints: ["Manh mối 1: Không treo tường bằng giấy.", "Manh mối 2: Ghi chép quá khứ loài người."] }
            ]
        };

        let currentMode = '';
        let currentIndex = 0;
        let score = 0;
        let currentQuestions = [];
        let historyLog = [];
        let hintsLeft = 0;
        let isMusicPlaying = false;
        let timer = null;
        let timeLeft = 30;

        document.addEventListener('click', function() {
            let music = document.getElementById('bg-music');
            if (!isMusicPlaying && music.paused) {
                music.play().then(() => {
                    isMusicPlaying = true;
                    document.getElementById('music-btn').innerText = "🔊 Nhạc: Bật";
                }).catch(e => console.log("Autoplay blocked"));
            }
        }, { once: true });

        function toggleMusic() {
            let music = document.getElementById('bg-music');
            let btn = document.getElementById('music-btn');
            if (music.paused) {
                music.play();
                btn.innerText = "🔊 Nhạc: Bật";
                isMusicPlaying = true;
            } else {
                music.pause();
                btn.innerText = "🔇 Nhạc: Tắt";
                isMusicPlaying = false;
            }
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function showModes() {
            clearInterval(timer);
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('summary-screen').classList.add('hidden');
            document.getElementById('mode-menu').classList.remove('hidden');
        }

        function showMain() {
            clearInterval(timer);
            document.getElementById('mode-menu').classList.add('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('summary-screen').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }

        function startGame(mode) {
            currentMode = mode;
            currentIndex = 0;
            score = 0;
            historyLog = [];
            currentQuestions = shuffleArray(questionsData[mode]);
            hintsLeft = Math.floor(currentQuestions.length / 2);

            document.getElementById('mode-menu').classList.add('hidden');
            document.getElementById('summary-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('mode-title').innerText = 'Chế độ: ' + mode;

            loadQuestion();
        }

        function loadQuestion() {
            clearInterval(timer);
            if (currentIndex < currentQuestions.length) {
                let qObj = currentQuestions[currentIndex];
                document.getElementById('question-text').innerText = (currentIndex + 1) + ". " + qObj.q;
                document.getElementById('user-answer').value = '';
                
                let hintBox = document.getElementById('hint-text');
                hintBox.style.display = 'none';
                hintBox.innerText = "";

                timeLeft = 30;
                updateTimerDisplay();
                timer = setInterval(() => {
                    timeLeft--;
                    updateTimerDisplay();
                    if (timeLeft <= 0) {
                        clearInterval(timer);
                        historyLog.push({
                            question: qObj.q,
                            userAns: "(Hết giờ)",
                            correct: false,
                            standardAns: qObj.a[0]
                        });
                        currentIndex++;
                        loadQuestion();
                    }
                }, 1000);
            } else {
                showSummary();
            }
        }

        function updateTimerDisplay() {
            document.getElementById('score-text').innerText = `Câu: ${currentIndex + 1}/${currentQuestions.length} | Điểm: ${score} | ⏱️ ${timeLeft}s`;
        }

        function useHint() {
            let qObj = currentQuestions[currentIndex];
            let hintBox = document.getElementById('hint-text');

            if (hintsLeft > 0) {
                hintsLeft--;
                let hintContent = qObj.hints.join("<br>💡 ");
                hintBox.style.display = 'block';
                hintBox.innerHTML = "💡 " + hintContent;
            } else {
                hintBox.style.display = 'block';
                hintBox.innerHTML = "⚠️ Bạn đã dùng hết lượt gợi ý trong màn này rồi!";
                hintBox.classList.add('shake-warning');

                setTimeout(() => {
                    hintBox.classList.remove('shake-warning');
                    hintBox.style.display = 'none';
                    hintBox.innerHTML = "";
                }, 3000);
            }
        }

        function skipQuestion() {
            let qObj = currentQuestions[currentIndex];
            historyLog.push({
                question: qObj.q,
                userAns: "(Đã bỏ qua)",
                correct: false,
                standardAns: qObj.a[0]
            });
            currentIndex++;
            loadQuestion();
        }

        function checkAnswer() {
            let userAns = document.getElementById('user-answer').value.trim();
            let qObj = currentQuestions[currentIndex];
            let correctList = qObj.a;

            if (userAns === "") {
                alert("Vui lòng nhập đáp án trước khi trả lời nhé!");
                return;
            }

            let lowerUserAns = userAns.toLowerCase();
            let isCorrect = correctList.some(ans => lowerUserAns.includes(ans));

            if (isCorrect) {
                score++;
                historyLog.push({
                    question: qObj.q,
                    userAns: userAns,
                    correct: true,
                    standardAns: correctList[0]
                });
            } else {
                historyLog.push({
                    question: qObj.q,
                    userAns: userAns,
                    correct: false,
                    standardAns: correctList[0]
                });
            }

            currentIndex++;
            loadQuestion();
        }

        function showSummary() {
            clearInterval(timer);
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('summary-screen').classList.remove('hidden');
            document.getElementById('final-score-title').innerText = `Tổng điểm: ${score} / ${currentQuestions.length}`;

            let listHTML = '';
            historyLog.forEach((item, index) => {
                if (item.correct) {
                    listHTML += `<div class="result-item">
                        <strong>C. ${index + 1}:</strong> ${item.question}<br>
                        - Đáp án của bạn: <span class="correct-text">${item.userAns} (Đúng)</span>
                    </div>`;
                } else {
                    listHTML += `<div class="result-item">
                        <strong>C. ${index + 1}:</strong> ${item.question}<br>
                        - Đáp án của bạn: <span class="wrong-text">${item.userAns} (Sai)</span><br>
                        - Đáp án chuẩn: <span style="color: #d97706;">${item.standardAns}</span>
                    </div>`;
                }
            });

            document.getElementById('result-list').innerHTML = listHTML;
        }

        document.getElementById('user-answer').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });
    </script>

</body>
</html>
